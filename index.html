<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pet Afterlife</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe0f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#33284a; --ink-2:#6a5f84; --ink-3:#9a91ad;
  --paper:#fdfaff; --paper-2:#f4eefb; --paper-3:#ebe3f6;
  --lantern:#ffc857; --lantern-deep:#e9962b; --rose:#ee7fa4; --rose-soft:#fde3ec;
  --meadow:#63b983; --meadow-soft:#e2f4e4; --skyblue:#7ea6ee;
  --line:rgba(51,40,74,.12);
  --glass:rgba(253,250,255,.88);
  --shadow:0 6px 24px rgba(51,40,74,.16);
  --display:"Baloo 2","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --sky-a:#7fb8f0; --sky-b:#fdf1e3;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:linear-gradient(var(--sky-a),var(--sky-b));overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:3px solid #6f5bd6;outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i .f{fill:currentColor;stroke:none}

#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#world:active{cursor:grabbing}
#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(51,40,74,.16));}

/* ---------- top ---------- */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px);
  display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:20}
#top>*{pointer-events:auto}
.row{display:flex;align-items:center;gap:8px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 2px 12px rgba(51,40,74,.13)}
#brand{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1}
#brand .mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 60%,#fff3c4,var(--lantern) 55%,var(--lantern-deep));display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,200,87,.3)}
#brand .mark svg{width:17px;height:17px;fill:var(--ink)}
.spacer{flex:1}
.tool{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;font-weight:700;font-size:13px}
.tool .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--paper)}
#stats{display:grid;grid-template-columns:repeat(4,1fr);border-radius:20px;padding:7px 4px;max-width:520px}
.stat{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;padding:0 4px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1;display:flex;align-items:center;gap:4px}
.stat b svg{width:14px;height:14px}
.stat>span{font-size:11px;color:var(--ink-2);white-space:nowrap;font-weight:500}
.stat.s-now b svg{color:var(--meadow)} .stat.s-heart b svg{color:var(--rose)} .stat.s-star b svg{color:var(--lantern-deep)} .stat.s-left b svg{color:var(--skyblue)}
#hallchip{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border-radius:999px;font-weight:600;font-size:14px}
#hallchip small{font-weight:500;color:var(--ink-2);font-size:13px}
#hallchip svg{width:16px;height:16px}
#banner{align-self:flex-start;padding:6px 12px;border-radius:12px;font-size:12.5px;font-weight:600;background:rgba(51,40,74,.82);color:#fff;max-width:100%}
#banner.warn{background:#8a4a1f}

#hint{position:fixed;left:50%;bottom:calc(var(--sab) + 108px);transform:translateX(-50%);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;
  white-space:nowrap;z-index:15;transition:opacity .6s;pointer-events:none}
#hint.gone{opacity:0}
#invite{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 40px));padding:22px 22px 20px;border-radius:26px;text-align:center;z-index:15;box-shadow:var(--shadow)}
#invite h2{font-family:var(--display);font-size:26px;line-height:1.1;margin-bottom:8px}
#invite p{color:var(--ink-2);margin-bottom:16px}

/* ---------- dock ---------- */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 10px);width:min(440px,calc(100% - 20px));
  display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;border-radius:26px;padding:6px 6px 7px;z-index:20}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:7px 2px 3px;border-radius:16px;min-height:50px}
.dbtn svg{color:var(--ink)}
.dbtn:active{background:var(--paper-3)}
#btn-home{color:var(--ink);margin-top:-26px}
#btn-home i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffe9a8,var(--lantern) 60%,#f7b23e);
  box-shadow:0 0 0 5px var(--paper),0 8px 20px rgba(233,150,43,.5);transition:transform .15s}
#btn-home:active i{transform:scale(.94)}
#btn-home svg{width:28px;height:28px;stroke-width:2.4}

/* ---------- sheets ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(51,40,74,.25);
  max-height:min(80dvh,calc(100dvh - var(--sat) - 70px));display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;
  transition:transform .42s cubic-bezier(.2,.85,.25,1),visibility 0s .42s;padding-bottom:var(--sab)}
#sheet.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.85,.25,1)}
#sheet.k-profile,#sheet.k-welcome{max-height:60dvh}
#sheet.k-profile #sheet-title{font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats,#hallchip,#banner{transition:opacity .25s}
@media (max-width:879px){body.sheet-open #stats,body.sheet-open #hallchip,body.sheet-open #banner{opacity:0;pointer-events:none}}
#sheet-head{display:flex;align-items:center;gap:10px;padding:16px 14px 8px 20px;flex:none;position:relative;touch-action:none}
#sheet-head::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--paper-3)}
#sheet-title{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.15;flex:1;min-width:0;letter-spacing:-.01em}
.xbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);flex:none}
#sheet-title:focus-visible{outline:none}
#sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 22px;overscroll-behavior:contain;flex:1;min-height:0}
@media (min-width:880px){
  #sheet,#sheet.k-profile,#sheet.k-welcome{left:auto;right:20px;top:20px;bottom:20px;width:430px;max-height:none;border-radius:28px;transform:translateX(112%);padding-bottom:0}
  #sheet.open{transform:none}
  #sheet-head::before{display:none}
  #top{max-width:560px}
  #dock{left:calc(var(--sal) + 20px);transform:none;bottom:20px}
  #hint{left:240px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15.5px;
  background:var(--lantern);color:var(--ink);box-shadow:0 4px 0 #e0a437;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e0a437}
.btn.quiet{background:var(--paper-2);box-shadow:none;font-weight:600}
.btn.quiet:active{transform:none;background:var(--paper-3)}
.btn.danger{background:none;box-shadow:none;color:#b3365e;font-weight:600}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.muted{color:var(--ink-2)} .small{font-size:13px}
.sect{font-family:var(--display);font-size:18px;font-weight:700;margin:22px 0 8px;line-height:1.2}
.sect:first-child{margin-top:6px}
.care{font-size:12.5px;color:var(--ink-2);margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);text-align:center;line-height:1.5}

.lst{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.it{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;text-align:left;width:100%}
.it:active,.it:hover{background:var(--paper-2)}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--paper-3);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.it .tx{min-width:0;flex:1}
.it .tx b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx span{display:block;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .tx span span{display:inline}
.it .tx span.q{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;color:var(--ink);font-size:14.5px;margin:2px 0}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--rose-soft);color:#a8386a;white-space:nowrap;flex:none}
.tag.g{background:var(--meadow-soft);color:#2d7a4c}
.tag.y{background:#fff1cc;color:#8a5a0c}
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:4px 20px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{flex:none;width:104px;text-align:center;padding:10px 6px 8px;border-radius:20px;background:var(--paper-2)}
.card img{width:68px;height:68px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff}
.card b{display:block;font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:11.5px;color:var(--ink-2)}
.emptyline{padding:14px 16px;border-radius:16px;background:var(--paper-2);color:var(--ink-2);font-size:14px}

/* halls */
.hall{display:flex;align-items:center;gap:14px;width:100%;padding:10px;border-radius:22px;text-align:left;border:2px solid transparent}
.hall+.hall{margin-top:6px}
.hall[aria-current=true]{border-color:var(--lantern);background:#fff8e3}
.hall .sw{width:64px;height:64px;border-radius:18px;flex:none;position:relative;overflow:hidden}
.hall .sw::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-34%;height:70%;border-radius:50%;background:var(--g)}
.hall b{font-family:var(--display);font-size:18px;line-height:1.15;display:block}
.hall span{font-size:13px;color:var(--ink-2);display:block}
.hall em{font-style:normal;font-size:12.5px;font-weight:700;color:#2d7a4c}

/* profile */
.caro{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.caro::-webkit-scrollbar{display:none}
.caro img{scroll-snap-align:center;flex:none;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:22px;background:var(--paper-3)}
.caro.multi img{width:88%}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--paper-3)} .dots i.on{background:var(--ink-2)}
.pdates{font-weight:600;margin-top:12px}
.pmeta{color:var(--ink-2);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 2px 8px;border-radius:18px;background:var(--paper-2);font-size:12px;font-weight:600;color:var(--ink-2);min-height:72px;transition:transform .12s}
.act:active{transform:scale(.95)}
.act b{font-family:var(--display);font-size:17px;color:var(--ink);line-height:1.1}
.act svg{width:24px;height:24px;color:var(--ink)}
.act.on{background:var(--rose-soft)} .act.on svg{color:var(--rose);fill:var(--rose)}
.act.a-candle.on{background:#fff1cc} .act.a-candle.on svg{color:var(--lantern-deep);fill:#ffd98a}
.act.a-flower.on{background:var(--meadow-soft)} .act.a-flower.on svg{color:#2d7a4c;fill:#bfe6c6}
.gifts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;padding:8px;border-radius:18px;background:var(--meadow-soft)}
.gift{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;padding:8px 0;border-radius:12px}
.gift[aria-pressed=true]{background:#fff;box-shadow:0 0 0 2px var(--meadow)}
.gift svg{width:30px;height:30px}
dl.facts{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
dl.facts dt{color:var(--ink-2);font-weight:500} dl.facts dd{margin:0;overflow-wrap:anywhere}
.story{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;font-size:15.5px;line-height:1.6}
.msg{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.msg .who{font-weight:700;font-size:13.5px} .msg .when{font-size:12px;color:var(--ink-3);margin-left:6px;font-weight:500}
.msg p{overflow-wrap:anywhere;white-space:pre-wrap}
.msg .del{margin-left:auto;color:var(--ink-3);width:36px;height:36px;display:grid;place-items:center;flex:none}
.msg .del svg{width:18px;height:18px}
.field{display:block;margin-top:14px}
.field>span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field>span i{font-style:normal;font-weight:400;color:var(--ink-2)}
.in{width:100%;border:1.5px solid var(--paper-3);background:#fff;border-radius:16px;padding:12px 14px;font-size:16px;min-height:48px;-webkit-appearance:none;appearance:none}
.in:focus{border-color:#8f7be6;box-shadow:0 0 0 3px rgba(143,123,230,.2)}
textarea.in{resize:none;line-height:1.5}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:8px 0;color:var(--ink-2)}
.check input{width:20px;height:20px;accent-color:#7b62d6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--paper-2);font-weight:600;font-size:14px;border:2px solid transparent;min-height:42px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:#fff8e3;border-color:var(--lantern)}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.swb{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.swb[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.steps{display:flex;gap:5px;margin:2px 0 12px}
.steps i{height:5px;flex:1;border-radius:5px;background:var(--paper-3)} .steps i.on{background:var(--lantern)}
.lead{color:var(--ink-2);margin-bottom:4px}
.nav2{display:flex;gap:10px;margin-top:20px}
.nav2 .btn{flex:1}
.nav2 .btn.quiet{flex:0 0 auto}
.err{color:#b3365e;font-size:13.5px;font-weight:600;margin-top:8px;min-height:1em}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--paper-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(51,40,74,.75);color:#fff;display:grid;place-items:center}
.ph button svg{width:16px;height:16px}
.ph .cv{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:var(--lantern);padding:2px 8px;border-radius:99px}
.addph{aspect-ratio:1;border-radius:16px;border:2px dashed var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:center;padding:4px}
.addph:focus-within{outline:3px solid #6f5bd6;outline-offset:2px}
.pmap{display:grid;grid-template-columns:repeat(6,1fr) 14px repeat(6,1fr);gap:5px;margin-top:10px;padding:14px;border-radius:20px;background:linear-gradient(#dff3d8,#c9eac2)}
.pmap button{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.75);border:1.5px dashed rgba(51,40,74,.3);min-width:0}
.pmap button.tk{background:#b9a8d6;border:0;opacity:.75;pointer-events:none}
.pmap button[aria-pressed=true]{background:var(--lantern);border:2.5px solid var(--ink)}
.pmap i{grid-row:1/span 10;grid-column:7;background:#f6e7c1;border-radius:6px}
.prev{display:flex;align-items:center;gap:14px;padding:12px;border-radius:20px;background:var(--paper-2);margin-top:14px}
.prev img{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff}
.copyrow{display:flex;gap:8px;margin-top:10px}
.owner{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}

/* list view fallback */
#listview{position:fixed;inset:0;overflow-y:auto;padding:calc(var(--sat) + 190px) 16px calc(var(--sab) + 110px);z-index:5}
#listview .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:900px;margin:0 auto}
#listview .tile{background:var(--glass);border-radius:22px;padding:14px 10px;text-align:center;box-shadow:0 2px 12px rgba(51,40,74,.12)}
#listview .tile img{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff}
#listview .tile b{display:block;font-family:var(--display);font-size:18px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#listview .tile span{font-size:12.5px;color:var(--ink-2)}
#listview .note{max-width:900px;margin:0 auto 12px;font-size:13px;font-weight:600;background:var(--glass);padding:8px 14px;border-radius:14px;display:inline-block}

#toast{position:fixed;left:50%;top:calc(var(--sat) + 150px);transform:translate(-50%,-12px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#scrim{position:fixed;inset:0;background:rgba(40,30,62,.45);z-index:60;display:grid;place-items:center;padding:24px}
#dialog{background:var(--paper);border-radius:26px;padding:22px;width:min(360px,100%);box-shadow:var(--shadow)}
#dialog h2{font-family:var(--display);font-size:22px;line-height:1.2;margin-bottom:6px}
#dialog .nav2{margin-top:18px}
#arrival{position:fixed;left:50%;bottom:calc(var(--sab) + 120px);transform:translateX(-50%);z-index:30;padding:12px 20px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:18px;text-align:center;max-width:calc(100% - 32px)}
body.arriving #dock,body.arriving #hint{opacity:0;pointer-events:none}
#dock{transition:opacity .3s}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="Memorial meadow"></canvas>
<div id="veil" aria-hidden="true"></div>
<main id="listview" hidden></main>

<header id="top">
  <div class="row">
    <button id="brand" class="glass" aria-haspopup="dialog"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.2" cy="10" r="2.2"/><circle cx="10" cy="6" r="2.2"/><circle cx="14.4" cy="6" r="2.2"/><circle cx="18" cy="10" r="2.2"/><path d="M12 10.5c-3 0-5.5 3.2-5.5 5.8 0 1.700 1.300 2.700 2.800 2.700 1.100 0 1.800-.500 2.700-.500s1.600.500 2.700.500c1.500 0 2.800-1 2.800-2.700 0-2.600-2.500-5.800-5.500-5.800z"/></svg></span><span>Pet Afterlife</span></button>
    <span class="spacer"></span>
    <button id="btn-bell" class="tool glass" aria-haspopup="dialog"></button>
    <button id="btn-lang" class="tool glass"></button>
    <button id="btn-sound" class="tool glass" aria-pressed="false"></button>
  </div>
  <div id="stats" class="glass" role="group">
    <div class="stat s-now"><b><span id="st-now">–</span></b><span data-i18n="st_now"></span></div>
    <div class="stat s-heart"><b><span id="st-hearts">–</span></b><span data-i18n="st_hearts"></span></div>
    <div class="stat s-star"><b><span id="st-stars">–</span></b><span data-i18n="st_stars"></span></div>
    <div class="stat s-left"><b><span id="st-left">–</span></b><span data-i18n="st_left"></span></div>
  </div>
  <button id="hallchip" class="glass" aria-haspopup="dialog"></button>
  <div id="banner" role="status" hidden></div>
</header>

<div id="hint" class="glass" aria-hidden="true"></div>
<section id="invite" class="glass" hidden>
  <h2 data-i18n="invite_h"></h2><p data-i18n="invite_p"></p>
  <button class="btn" id="invite-btn" data-i18n="bring_home"></button>
</section>

<nav id="dock" class="glass">
  <button class="dbtn" id="btn-plaza" aria-haspopup="dialog"></button>
  <button class="dbtn" id="btn-search" aria-haspopup="dialog"></button>
  <button class="dbtn" id="btn-home" aria-haspopup="dialog"></button>
  <button class="dbtn" id="btn-random"></button>
  <button class="dbtn" id="btn-halls" aria-haspopup="dialog"></button>
</nav>

<section id="sheet" role="dialog" aria-labelledby="sheet-title" aria-hidden="true">
  <div id="sheet-head"><h2 id="sheet-title" tabindex="-1"></h2><button class="xbtn" id="sheet-x"></button></div>
  <div id="sheet-body"></div>
</section>

<div id="arrival" class="glass" role="status" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

  const fail=e=>{console.warn('meadow',e&&e.code,e);if(e&&e.code==='revoked'){S.readOnly=true;UI.banner('guest')}else if(!gotAny)UI.banner('offline',true)};

function writeFailed(e){
  const c=e&&e.code;console.warn('write',c,e);
  if(c==='quota_exceeded'||c==='resource_exhausted')UI.toast(t('err_quota'));
  else if(c==='invalid_argument'||c==='revoked'||c==='permission_denied'){S.readOnly=true;UI.banner('guest');UI.toast(t('guest'))}
  else UI.toast(t('err_generic'));
}
async function boot(){
  const demo=()=>{BE=makeDemo();S.mode='demo';UI.banner('demo');emit('mems');emit('marks');emit('letters');emit('presence')};
  if(typeof window.claude==='undefined'||typeof window.claude?.use!=='function')return demo();
  const lim=(p,ms)=>Promise.race([Promise.resolve(p).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),ms))]);
  let db=null,user=null;
  try{[db,user]=await Promise.all([lim(window.claude.use('db'),10000),lim(window.claude.use('user'),10000)])}catch(e){}
  if(!db)return demo();
  S.mode='live';
  if(user){try{S.uid=await lim(user.id(),5000)}catch(e){}
    try{S.isOwner=!!(await lim(user.isOwner(),3000))}catch(e){}
    try{const can=await lim(user.can('data.write'),3000);if(can===false)S.readOnly=true}catch(e){}}
  if(!S.uid)S.readOnly=true;
  if(S.readOnly)UI.banner('guest');
  try{BE=makeLive(db,user)}catch(e){console.error(e);return demo()}
}

{let y0=null;const hd=$('#sheet-head');hd.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;y0=e.clientY});hd.addEventListener('pointermove',e=>{if(y0!=null&&e.clientY-y0>70){y0=null;closeSheet()}});hd.addEventListener('pointerup',()=>y0=null);hd.addEventListener('pointercancel',()=>y0=null)}

    return `<h3 class="sect">${t('pl_today')}</h3>`+(today.length?`<div class="lst">${today.map(u=>item(u.m,esc(dayKind(u)),'<span class="tag">'+ic('candle')+'</span>')).join('')}</div>`:`<p class="emptyline">${t('pl_today_none')}</p>`)

function note(freq,when,vol,dur){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+.02);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(master);o.start(when);o.stop(when+dur+.05)}

  if(!S.sound){if(AC){master.gain.setTargetAtTime(0,AC.currentTime,.3);clearTimeout(chimeT);setTimeout(()=>{if(!S.sound&&AC)AC.suspend()},1200)}return}
  try{if(!AC){const Ctx=window.AudioContext||window.webkitAudioContext;AC=new Ctx();master=AC.createGain();master.gain.value=0;
      const dl=AC.createDelay(1),fb=AC.createGain();dl.delayTime.value=.42;fb.gain.value=.35;master.connect(AC.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);const wet=AC.createGain();wet.gain.value=.5;dl.connect(wet);wet.connect(AC.destination);
      const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.connect(master);
      [130.8,196,261.6,329.6].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.type=i%2?'sine':'triangle';o.frequency.value=f;o.detune.value=(i-1.5)*6;g.gain.value=.03;l.frequency.value=.05+i*.023;lg.gain.value=.018;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(lp);o.start();l.start()});
      const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const ns=AC.createBufferSource();ns.buffer=buf;ns.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.6;const ng=AC.createGain();ng.gain.value=.02;const nl=AC.createOscillator(),nlg=AC.createGain();nl.frequency.value=.08;nlg.gain.value=.014;nl.connect(nlg);nlg.connect(ng.gain);ns.connect(bp);bp.connect(ng);ng.connect(master);ns.start();nl.start()}
    AC.resume();master.gain.setTargetAtTime(.8,AC.currentTime,.8);
    const scale=[523.3,587.3,659.3,784,880,1046.5,1174.7];const loop=()=>{if(!S.sound)return;note(scale[Math.floor(Math.random()*scale.length)],AC.currentTime+.05,.05,3);if(Math.random()<.35)note(scale[Math.floor(Math.random()*scale.length)]/2,AC.currentTime+.5,.04,3.5);chimeT=setTimeout(loop,2600+Math.random()*4200)};clearTimeout(chimeT);loop();
  }catch(e){S.sound=false;soundBtn()}}
function toggleLang(){S.lang=S.lang==='zh'?'en':'zh';LS.set('pa-lang',S.lang);applyLang()}

/* ---------- routing ---------- */
function route(){const h=(location.hash||'').slice(1);const m=/^m-([A-Za-z0-9_-]+)$/.exec(h);
  if(m){if(sheetKind==='profile'&&sheetCtx.id===m[1])return;if(S.mems.has(m[1])){pendingId=null;visit(m[1])}else if(S.loaded&&S.mode!=='boot'&&(S.mode==='demo'||S.mems.size)){pendingId=null;UI.toast(t('not_found'));setHash('')}else pendingId=m[1]}
  else if(h==='plaza')openPlaza();else if(h==='list'){listMode=true;renderList()}}
addEventListener('hashchange',route);

/* ---------- start ---------- */
$('#btn-plaza').onclick=openPlaza;$('#btn-search').onclick=openSearch;$('#btn-halls').onclick=openHalls;$('#hallchip').onclick=openHalls;$('#btn-bell').onclick=openBell;$('#brand').onclick=openAbout;
$('#btn-random').onclick=randomVisit;$('#btn-home').onclick=()=>{if(S.mode!=='boot')startWizard()};$('#invite-btn').onclick=()=>startWizard();$('#btn-lang').onclick=toggleLang;$('#btn-sound').onclick=toggleSound;
addEventListener('resize',updateShift);document.addEventListener('pointerdown',()=>UI.touched(),{passive:true});
on('mems',()=>{refreshChrome();world&&world.sync();if(no3d||listMode)renderList();
  if(pendingId&&S.loaded){const id=pendingId;if(S.mems.has(id)){pendingId=null;visit(id)}else if(S.mems.size){pendingId=null;UI.toast(t('not_found'));setHash('')}}
  if(sheetKind==='profile'&&!S.mems.has(sheetCtx.id)){closeSheet();return}
  if(sheetKind==='wizard'&&Wz&&Wz.step===5&&!Wz.busy)wizRender();
  else if(sheetKind&&sheetCtx.live&&sheetCtx.live.includes('mems'))sheetCtx.reopen()});
on('marks',()=>{refreshChrome();world&&world.sync();refreshActs()});
on('letters',()=>{if(sheetKind==='plaza')sheetCtx.reopen()});
on('presence',refreshChrome);
S.lang=LS.get('pa-lang')||((navigator.language||'en').toLowerCase().startsWith('zh')?'zh':'en');
applyLang();
try{world=initWorld()}catch(e){console.error(e);world=null}
if(!world)UI.no3d();
if(S.mode==='boot'){$('#banner').hidden=false;$('#banner').textContent=t('loading')}
boot().then(()=>{if($('#banner').textContent===t('loading'))UI.banner(null);refreshChrome();if(world&&S.mode==='demo'){world.home();world.sync()}route()});
let homed=false;on('mems',()=>{if(!homed&&S.loaded&&world&&!sheetKind){homed=true;world.sync();world.home()}});
window.__pa={S,world:()=>world,visit,setHall};
})();
